name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      # React Native 0.74+ requires JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ubuntu-latest has Android SDK + NDK pre-installed.
      # Detect which NDK version is available and wire it up so Gradle uses it.
      - name: Configure Android SDK and NDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "Available NDK versions:"
          ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "(none found)"

          # Use the highest pre-installed NDK version
          NDK_VERSION=$(ls $ANDROID_HOME/ndk/ 2>/dev/null | sort -V | tail -1)

          if [ -n "$NDK_VERSION" ]; then
            echo "Using pre-installed NDK: $NDK_VERSION"
            # Override ndkVersion in gradle.properties so the build uses this NDK
            echo "ndkVersion=$NDK_VERSION" >> android/gradle.properties
          else
            echo "No NDK found — installing NDK 27.1.12297006 via sdkmanager"
            SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" 2>/dev/null | head -1)
            if [ -n "$SDKMANAGER" ]; then
              yes | $SDKMANAGER "ndk;27.1.12297006" 2>&1
            else
              echo "sdkmanager not found — build may fail"
            fi
          fi

          # Accept all SDK licenses
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | $SDKMANAGER --licenses 2>/dev/null || true
          fi

          # Print final gradle.properties ndkVersion line for verification
          grep ndkVersion android/gradle.properties || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --stacktrace \
            2>&1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trainsmash-collage-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Always upload build reports on failure for debugging
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: android/app/build/reports/
          retention-days: 3
