name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "Available NDK versions:"
          ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "(none)"
          NDK_VERSION=$(ls $ANDROID_HOME/ndk/ 2>/dev/null | sort -V | tail -1)
          if [ -n "$NDK_VERSION" ]; then
            echo "Using pre-installed NDK: $NDK_VERSION"
            echo "ndkVersion=$NDK_VERSION" >> android/gradle.properties
          fi
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" 2>/dev/null | head -1)
          [ -n "$SDKMANAGER" ] && yes | $SDKMANAGER --licenses 2>/dev/null || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        id: gradle_build
        run: |
          cd android
          set -o pipefail
          ./gradlew assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --warning-mode all \
            2>&1 | tee ../build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trainsmash-collage-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Print the tail of the build log directly — readable by expanding this step
      - name: Show build error (last 150 lines)
        if: failure()
        run: |
          echo "======= LAST 150 LINES OF BUILD LOG ======="
          tail -150 build.log || echo "(build.log not found)"
          echo "==========================================="
