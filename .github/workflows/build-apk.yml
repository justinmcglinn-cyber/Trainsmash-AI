name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      # React Native 0.74+ requires JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Detect which NDK is pre-installed and configure Gradle to use it
      - name: Configure Android NDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "Available NDK versions:"
          ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "(none)"

          NDK_VERSION=$(ls $ANDROID_HOME/ndk/ 2>/dev/null | sort -V | tail -1)
          if [ -n "$NDK_VERSION" ]; then
            echo "Using pre-installed NDK: $NDK_VERSION"
            echo "ndkVersion=$NDK_VERSION" >> android/gradle.properties
          fi

          # Accept SDK licenses
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name "sdkmanager" 2>/dev/null | head -1)
          [ -n "$SDKMANAGER" ] && yes | $SDKMANAGER --licenses 2>/dev/null || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --info \
            2>&1 | tee ../build.log
          # Re-check exit code (tee swallows it)
          exit ${PIPESTATUS[0]}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trainsmash-collage-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Upload full build log on failure so we can see the exact error
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
